output_root = "/nrs/shroff/malinmayorc/cellpose/SLS267xOH15257"
lsf_project = "shroff"  # LSF billing project for scripts/submit_p4_cluster.sh

[cellpose]
mode = "three_d_flows"

[cellpose.preprocess.normalize]
smooth_radius = 1.0

[cellpose.inference]
anisotropy = 9.355  # Z spacing 0.5um / XY pixel size 0.

[cellpose.postprocess]
flow_threshold = 0.4
cellprob_threshold = -10.0
flow3D_smooth = 2.0  # Gaussian sigma on the 3D flow field; 0 is no smoothing
min_size = 200

[data-loader]
raw_path = "/nrs/shroff/Pharynx_Project/Data/SLS267xOH15257/080626_Dataset_2/Raw_Data/561/t7.tif"
center_third_xy = true
