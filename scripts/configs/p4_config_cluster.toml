output_root = "/nrs/shroff/malinmayorc/cellpose/SLS161"
lsf_project = "shroff"  # LSF billing project for scripts/submit_p4_cluster.sh

[cellpose]
do_3D = true
anisotropy = 9.355  # Z spacing 0.5um / XY pixel size 0.0534um, raw/p4.tif
flow_threshold = 0.4
cellprob_threshold = -10.0
flow3D_smooth = 1.0  # Gaussian sigma on the 3D flow field; 0 is no smoothing
min_size = 200

[cellpose.normalize]
smooth_radius = 5.0  # in-plane Gaussian sigma in XY pixels; ~1/10 

[data-loader]
raw_path = "/groups/shroff/shrofflab/xinyi/HighSNR_embryo_SLS161/for_Caroline/raw/p4.tif"
timepoint = 0
nuclear_channel = 1  # 488, confirmed by eye against processed/p4-488_t1.tif
center_third = true  # ~27x less work for a parameter sweep; edges of the embryo are cut off
